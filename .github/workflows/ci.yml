name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, e2e (web + server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (web + server)
        run: npm run lint

      - name: Typecheck (web + server)
        run: npm run typecheck

      - name: Unit + integration tests (Vitest, real WebSocket server)
        run: npm test

      - name: Build server
        run: npm run build -w server

      - name: Build web for e2e (points at ws://localhost:5312)
        run: npm run build:e2e -w web

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build + local server)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
